<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>action button | Server Editor</title>
    <style>
        :root {
            --main: #333c45;
            --background: #eeeaea;
            --accent: #6e79d6;
        }

        *, ::after, ::before {
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background: var(--background);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: auto;
        }

        .header {
            max-height: 46px;
            background-color: var(--main);
            width: 100%;
            padding: 0 8px 0 8px;
            display: flex;
            align-items: center;
            flex: 1;
            justify-content: space-between;
            position: fixed;
            z-index: 100;
        }

        .header-text {
            color: white;
            font-weight: 200;
        }

        .flex-center {
            display: flex;
            align-items: center;
        }

        .flex-col {
            display: flex;
            flex-flow: column;
        }

        .btn {
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 400;
            min-width: 110px;
            text-align: center;
            white-space: nowrap;
            vertical-align: middle;
            user-select: none;
            padding: .275rem .65rem;
            font-size: 0.9rem;
            line-height: 1.5;
            border-radius: 1rem;
            cursor: pointer;
            transition: color .15s ease-in-out, background-color .15s ease-in-out, border-color .15s ease-in-out, box-shadow .15s ease-in-out;
        }

        .btn-light {
            background-color: #fff;
            border: 1px solid #fff;
            color: #000;
        }

        .btn-light:hover:not(:disabled) {
            background-color: #d0d0d0;
            border-color: #d0d0d0;
            cursor: pointer;
        }

        .btn-dark {
            background-color: #4d5156;
            border: 1px solid #4d5156;
            color: #fff;
        }

        .btn-dark:hover:not(:disabled) {
            background-color: #3b3e42;
            border-color: #3b3e42;
            cursor: pointer;
        }

        .btn-accent {
            background-color: var(--accent);
            border: 1px solid var(--accent);
            color: #fff;
        }

        .btn-accent:hover:not(:disabled) {
            background-color: #5863c4;
            border-color: #5863c4;
            cursor: pointer;
        }

        .btn:disabled {
            color: lightgray;
            background-color: gray;
            border: 1px solid gray;
            cursor: not-allowed;
        }

        .main {
            display: flex;
            flex: 1;
            width: 100%;
            padding: 1rem;
            flex-flow: column;
            align-items: flex-start;
            margin-top: 46px;
            height: calc(100vh - 46px);
        }

        .section-container {
            display: flex;
            flex-flow: column;
            margin-top: 1rem;
            align-items: flex-start;
            border-bottom: 4px solid var(--main);
            width: 100%;
        }

        .section-header {
            background-color: var(--main);
            color: white;
            padding: 4px 12px 2px 10px;
            font-size: 1rem;
            font-weight: 500;
        }

        .border {
            background: white;
            border: 1px solid lightgray;
            border-radius: 5px;
            box-shadow: 0 2px 7px #13537a24;
            padding: 12px;
            width: 100%;
        }

        .settings-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 12px 0;
        }

        .control {
            padding: 6px 10px;
            font-size: 0.9rem;
            border: 1px solid #ced4da;
            border-radius: 4px;
            min-width: 250px;
            outline: none;
        }

        .control:focus {
            border-color: var(--accent);
        }

        .editor-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
            border-radius: 5px;
            border: 1px solid lightgray;
            box-shadow: 0 2px 7px #13537a24;
            width: 100%;
        }

        .editor-header {
            padding: 8px 16px;
            background: #fafafa;
            border-bottom: 1px solid lightgray;
            font-weight: 600;
            font-size: 0.9rem;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .char-count {
            font-weight: normal;
            font-size: 0.8rem;
            color: #666;
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
        }

        #codeEditor {
            flex-grow: 1;
            width: 100%;
            border: none;
            padding: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            background: #1e1e1e;
            color: #d4d4d4;
            box-sizing: border-box;
            outline: none;
        }

        #status { font-size: 0.85rem; }

        @media screen and (max-width: 800px) {
            .--hidden-sm {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="flex-center">
        ^DEVICE_LOGO^
        <div style="display: flex; align-items: baseline; margin-left: 12px;">
            <h2 class="header-text">action button</h2>
            <h2 class="header-text --hidden-sm">&nbsp|&nbsp</h2>
            <h4 class="header-text --hidden-sm">Server Editor</h4>
        </div>
    </div>
    <div class="flex-center" style="gap: 10px;">
        <button class="btn btn-light" onclick="location.href='/'">Back</button>
        <button id="saveBtn" class="btn btn-accent">Save & Apply</button>
    </div>
</div>

<div class="main">
    <div class="section-container">
        <span class="section-header">Onboard Server Page</span>
    </div>

    <div class="border settings-row">
        <label for="dashPath" style="font-weight: bold; color: #333; font-size: 0.9rem;">Server URL:</label>
        <input type="text" id="dashPath" class="control" value="/dashboard" placeholder="server url">
        <a id="previewLink" href="/dashboard" target="_blank" style="color: var(--accent); margin-left: auto; text-decoration: none; font-weight: 500;">Open ↗</a>
    </div>

    <div class="editor-container">
        <div class="editor-header">
            <div>
                HTML Code
                <span id="charCount" class="char-count">0 chars</span>
            </div>
            <span id="status" style="color: #667;">Ready</span>
        </div>
        <textarea id="codeEditor" spellcheck="false" placeholder="Put HTML code here..."></textarea>
    </div>
</div>

<script>
    const pathInput = document.getElementById('dashPath');
    const editor = document.getElementById('codeEditor');
    const saveBtn = document.getElementById('saveBtn');
    const statusTxt = document.getElementById('status');
    const charCountTxt = document.getElementById('charCount');
    const previewLink = document.getElementById('previewLink');

    editor.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            const start = this.selectionStart;
            const end = this.selectionEnd;
            this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + 4;
            updateCharCount();
        }
    });

    function updateCharCount() {
        const len = editor.value.length;
        charCountTxt.innerText = len.toLocaleString() + " chars";

        if (len > 32768) {
            charCountTxt.style.background = "#f8d7da";
            charCountTxt.style.color = "#721c24";
        } else {
            charCountTxt.style.background = "#e9ecef";
            charCountTxt.style.color = "#666";
        }
    }

    editor.addEventListener('input', updateCharCount);

    pathInput.addEventListener('input', () => {
        let val = pathInput.value.trim();
        if(!val.startsWith('/')) val = '/' + val;
        previewLink.href = val;
    });

    function loadData() {
        statusTxt.innerText = "Loading config...";

        fetch('/server/load-config')
            .then(res => res.json())
            .then(data => {
                if(data.path) {
                    pathInput.value = data.path;
                    previewLink.href = data.path;
                }

                statusTxt.innerText = "Loading HTML...";
                return fetch('/server/load-html');
            })
            .then(res => res.text())
            .then(html => {
                editor.value = html;
                updateCharCount();
                statusTxt.innerText = "Done";
            })
            .catch(err => {
                statusTxt.innerText = "New File or Error";
                console.error(err);
            });
    }

    saveBtn.onclick = () => {
        let pathVal = pathInput.value.trim() || "/dashboard";
        if(!pathVal.startsWith('/')) pathVal = '/' + pathVal;

        const htmlContent = editor.value;
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const formData = new FormData();

        formData.append("file", blob, "index.html");

        saveBtn.disabled = true;
        statusTxt.innerText = "Uploading (" + Math.round(blob.size / 1024) + " KB)...";

        fetch(`/server/upload?path=${encodeURIComponent(pathVal)}`, {
            method: 'POST',
            body: formData
        })
            .then(res => {
                if (res.ok) {
                    statusTxt.innerText = "Saved!";
                    statusTxt.style.color = "green";
                } else throw new Error();
            })
            .catch(() => {
                statusTxt.innerText = "Upload Failed!";
                statusTxt.style.color = "red";
            })
            .finally(() => {
                saveBtn.disabled = false;
                setTimeout(() => {
                    statusTxt.style.color = "#667";
                    if(statusTxt.innerText === "Saved!") statusTxt.innerText = "Ready";
                }, 3000);
            });
    };

    loadData();
</script>
</body>
</html>
